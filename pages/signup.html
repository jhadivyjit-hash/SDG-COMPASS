<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | SDG Life Compass</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            🌍
        </div>

        <h1>
            Create Your Account
        </h1>

        <p class="auth-subtitle">
            Start your journey toward a more sustainable future.
        </p>


        <form id="signupForm">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button auth-button"
            >
                Create Account
            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a
            href="../index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </section>

</main>


<script src="../js/app.js"></script>

</body>
</html>
