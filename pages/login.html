<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SDG Life Compass</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-logo">
                🌍
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Continue your SDG journey.
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button auth-button"
                >
                    Login
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </p>


            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </section>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
